# Local development: dev modes, host ports and images built from the sibling repos.
services:
  mysql:
    ports:
      - '${MYSQL_PORT:-13306}:3306'

  nats:
    ports:
      - '${NATS_PORT:-4222}:4222'
      - '${NATS_MONITOR_PORT:-8222}:8222'

  keycloak:
    # Dynamic hostname: the admin console (realm master) follows the browser's URL.
    # Realm telemetry pins its issuer with frontendUrl=http://keycloak:8080 (realm JSON).
    command: ['start-dev', '--import-realm']
    ports:
      - '${KEYCLOAK_PORT:-8080}:8080'
    volumes:
      - ./keycloak/realm-telemetry.json:/opt/keycloak/data/import/realm-telemetry.json:ro

  traccar:
    ports:
      - '${TRACCAR_WEB_PORT:-18082}:8082'
      - '${TRACCAR_OSMAND_PORT:-15055}:5055'
    volumes:
      - ./traccar/traccar.local.xml:/opt/traccar/conf/traccar.xml:ro

  traccar-adapter:
    build:
      context: ${TRACCAR_ADAPTER_SRC:-../traccar-adapter}
    ports:
      - '${ADAPTER_PORT:-3000}:3000'
